<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1350 954.6429" data-source-pdf="дом-1 А3.pdf" data-source-page="1" data-source-sha256="49ae7d8ee62fc5bb22c74148f55ff273888cb6bdd9a357a4b8423adb42175141" data-project-sheet="Приложение" data-edition="source">
  <title>Гарантийные обязательства и пояснения покупателю</title>
  <rect width="100%" height="100%" fill="white" />
  <g data-source-region="Страница покупателю · рамка и заголовок">
    <path d="M66 21 L1320 21 L1320 910 L66 910 Z" stroke="#000000" fill="none" stroke-width="1.05" />
    <text transform="translate(693 66) rotate(0) scale(0.76 1)" x="-283.0029" y="0" font-size="20" font-family="Arial, Liberation Sans, sans-serif" textLength="566.0059" lengthAdjust="spacingAndGlyphs">ПОКУПАТЕЛЮ И ПОДРЯДЧИКУ (по поручению Покупателя)</text>
  </g>
  <g data-source-region="Гарантийные обязательства и юридические вопросы">
    <text transform="translate(384 97) rotate(0) scale(0.76 1)" x="-132.3984" y="0" font-size="16" font-family="Arial, Liberation Sans, sans-serif" textLength="264.7969" lengthAdjust="spacingAndGlyphs">ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА</text>
    <text transform="translate(384 114) rotate(0) scale(0.76 1)" x="-202.7617" y="0" font-size="16" font-family="Arial, Liberation Sans, sans-serif" textLength="405.5234" lengthAdjust="spacingAndGlyphs">и ограничение ответственности разработчика проекта</text>
    <text transform="translate(83 140.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="652.2852" lengthAdjust="spacingAndGlyphs">Уважаемый Покупатель (Застройщик)! Благодарим Вас за выбор проекта, разработанного в нашем</text>
    <text transform="translate(83 157.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="291.0537" lengthAdjust="spacingAndGlyphs">архитектурном бюро ООО ”Проектный Дом”.</text>
    <text transform="translate(83 184) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="682.9922" lengthAdjust="spacingAndGlyphs">В случае возникновения замечаний или вопросов по проекту Застройщик (или Подрядчик по поручению</text>
    <text transform="translate(83 201) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="640.5957" lengthAdjust="spacingAndGlyphs">Покупателя) передает их Разработчику (Автору проекта) до начала строительства, в письменном</text>
    <text transform="translate(83 218) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="632.5635" lengthAdjust="spacingAndGlyphs">виде, для разъяснения или внесения соответствующих корректировок в проект. Исполнитель не</text>
    <text transform="translate(83 235) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="626.9717" lengthAdjust="spacingAndGlyphs">обязан консультировать Застройщика (или подрядчика) по вопросам технологии и организации</text>
    <text transform="translate(83 252) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="237.8701" lengthAdjust="spacingAndGlyphs">строительства, производства работ.</text>
    <text transform="translate(83 278.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="547.9482" lengthAdjust="spacingAndGlyphs">Для ответов на вопросы обращайтесь по тел. 8-812-332-52-25 (г. Санкт-Петербург),</text>
    <text transform="translate(83 295.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="635.25" lengthAdjust="spacingAndGlyphs">info@plans1.ru и 8-495-660-39-13 (г.Москва). При обращении к нам с вопросами мы оставляем за</text>
    <text transform="translate(83 312.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="608.3574" lengthAdjust="spacingAndGlyphs">собой право попросить Вас назвать номер Договора, имя Покупателя по договору и дату его</text>
    <text transform="translate(83 329.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="81.1016" lengthAdjust="spacingAndGlyphs">заключения.</text>
    <text transform="translate(83 356) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="657.8154" lengthAdjust="spacingAndGlyphs">Претензии по комплектности и внешнему виду документации принимаются в течении 14 дней после</text>
    <text transform="translate(83 373) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="92.1006" lengthAdjust="spacingAndGlyphs">ее получения.</text>
    <text transform="translate(83 399.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="622.6309" lengthAdjust="spacingAndGlyphs">В течение 1 года (гарантийный срок) Разработчик бесплатно устраняет любые несоответствия</text>
    <text transform="translate(83 416.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="615.542" lengthAdjust="spacingAndGlyphs">проекта действующим федеральным требованиям нормам и правилам. При выявлении таких</text>
    <text transform="translate(83 433.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="633.4932" lengthAdjust="spacingAndGlyphs">несоответствий Разработчик вносит в проект дополнения и изменения в объеме необходимом и</text>
    <text transform="translate(83 450.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="656.2158" lengthAdjust="spacingAndGlyphs">достаточном для приведения проекта в соответствие с федеральным законодательством, в срок от</text>
    <text transform="translate(83 467.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="302.832" lengthAdjust="spacingAndGlyphs">3 рабочих дней, но не более 10 рабочих дней.</text>
    <text transform="translate(83 494) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="631.7979" lengthAdjust="spacingAndGlyphs">Это гарантийное обязательство теряет силу в случае, если в проект были внесены изменения и</text>
    <text transform="translate(83 511) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="670.9609" lengthAdjust="spacingAndGlyphs">дополнения третьими лицами или допущены отступления от проекта непосредственно Застройщиком</text>
    <text transform="translate(384 537.5) rotate(0) scale(0.76 1)" x="-106.4766" y="0" font-size="16" font-family="Arial, Liberation Sans, sans-serif" textLength="212.9531" lengthAdjust="spacingAndGlyphs">ЮРИДИЧЕСКИЕ ВОПРОСЫ</text>
    <text transform="translate(83 564) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="689.8281" lengthAdjust="spacingAndGlyphs">Заключенный Вами договор является подтверждением соблюдения Вами российского законодательства</text>
    <text transform="translate(83 581) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="142.8164" lengthAdjust="spacingAndGlyphs">по авторским правам.</text>
    <text transform="translate(83 607.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="618.6523" lengthAdjust="spacingAndGlyphs">Архитектурный проект является объектом авторского права, в силу чего ему предоставляется</text>
    <text transform="translate(83 624.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="629.3779" lengthAdjust="spacingAndGlyphs">правовая охрана как произведению архитектуры. В соответствии со статьей 1229 Гражданского</text>
    <text transform="translate(83 641.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="669.2383" lengthAdjust="spacingAndGlyphs">кодекса РФ другие лица не могут использовать архитектурный проект без согласия Правообладателя</text>
    <text transform="translate(83 658.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="213.0488" lengthAdjust="spacingAndGlyphs">(Автора проекта, Разработчика).</text>
    <text transform="translate(83 685) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="636.8291" lengthAdjust="spacingAndGlyphs">Одновременно, согласно статье 1250 Гражданского кодекса РФ, отсутствие вины нарушителя не</text>
    <text transform="translate(83 702) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="613.252" lengthAdjust="spacingAndGlyphs">освобождает его от обязанности прекратить нарушение интеллектуальных прав. В частности</text>
    <text transform="translate(83 719) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="670.5371" lengthAdjust="spacingAndGlyphs">пресечения действий, нарушающих исключительное право на архитектурный проект, осуществляется</text>
    <text transform="translate(83 736) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="306.0791" lengthAdjust="spacingAndGlyphs">независимо от вины нарушителя и за его счет.</text>
  </g>
  <g data-source-region="Технические вопросы и дополнительные услуги">
    <text transform="translate(1011 97) rotate(0) scale(0.76 1)" x="-103.2266" y="0" font-size="16" font-family="Arial, Liberation Sans, sans-serif" textLength="206.4531" lengthAdjust="spacingAndGlyphs">ТЕХНИЧЕСКИЕ ВОПРОСЫ</text>
    <text transform="translate(724 123.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="570.835" lengthAdjust="spacingAndGlyphs">Настоящий готовый проект требует привязки к конкретным условиям строительства на</text>
    <text transform="translate(724 140.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="143.4795" lengthAdjust="spacingAndGlyphs">участке Застройщика.</text>
    <text transform="translate(724 167) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="561.9482" lengthAdjust="spacingAndGlyphs">Настоящий проект – это рабочая документация для профессионального применения.</text>
    <text transform="translate(724 184) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="623.3281" lengthAdjust="spacingAndGlyphs">Строительство дома должна выполнять профессиональная бригада, умеющая читать чертежи</text>
    <text transform="translate(724 201) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="350.875" lengthAdjust="spacingAndGlyphs">и знающая технологию строительного производства..</text>
    <text transform="translate(724 227.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="566.2891" lengthAdjust="spacingAndGlyphs">Использование современных строительных технологий требует выбора строительной</text>
    <text transform="translate(724 244.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="634.3477" lengthAdjust="spacingAndGlyphs">организации–подрядчика (субподрядчика), имеющей достаточные знания и опыт использования</text>
    <text transform="translate(724 261.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="129.6777" lengthAdjust="spacingAndGlyphs">данных технологий.</text>
    <text transform="translate(724 288) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="632.9805" lengthAdjust="spacingAndGlyphs">В состав проекта не входят разделы по установке специализированного оборудования (камины,</text>
    <text transform="translate(724 305) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="652.4219" lengthAdjust="spacingAndGlyphs">сауна, кухонное оборудование, джакузи, бойлеры, котлы, кондиционеры, оборудование бассейна и</text>
    <text transform="translate(724 322) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="515.9355" lengthAdjust="spacingAndGlyphs">пр.), а также инженерные сети. Эти разделы разрабатываются дополнительно</text>
    <text transform="translate(724 339) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="486.2334" lengthAdjust="spacingAndGlyphs">организациями–поставщиками до начала или в ходе строительных работ.</text>
    <text transform="translate(724 365.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="569.5498" lengthAdjust="spacingAndGlyphs">Изменения, вносимые в архитектурный проект при его реализации, а также изменения</text>
    <text transform="translate(724 382.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="535.5684" lengthAdjust="spacingAndGlyphs">(достройка, пристройка, перестройка, перепланировка), вносимые в построенный</text>
    <text transform="translate(724 399.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="564.1699" lengthAdjust="spacingAndGlyphs">архитектурный объект, могут быть выполнены без согласования с Архитектором как с</text>
    <text transform="translate(724 416.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="591.7256" lengthAdjust="spacingAndGlyphs">автором (правообладателем) архитектурного проекта. Вся ответственность за нарушение</text>
    <text transform="translate(724 433.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="596.0117" lengthAdjust="spacingAndGlyphs">норм проектирования при проведении корректировки ложится на подрядчика и покупателя</text>
    <text transform="translate(724 450.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="99.5107" lengthAdjust="spacingAndGlyphs">(Застройщика).</text>
    <text transform="translate(1011 477) rotate(0) scale(0.76 1)" x="-112.8047" y="0" font-size="16" font-family="Arial, Liberation Sans, sans-serif" textLength="225.6094" lengthAdjust="spacingAndGlyphs">ДОПОЛНИТЕЛЬНЫЕ УСЛУГИ</text>
    <text transform="translate(724 503.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="333.7031" lengthAdjust="spacingAndGlyphs">Мы также выполняем следующие работы и услуги:</text>
    <text transform="translate(724 520.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="503.4189" lengthAdjust="spacingAndGlyphs">– адаптация фундамента на участке Застройщика на основании материалов</text>
    <text transform="translate(724 537.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="608.5557" lengthAdjust="spacingAndGlyphs">инженерно–геологических изысканий, а также рекомендации по подходящему фундаменту в</text>
    <text transform="translate(724 554.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="142.1191" lengthAdjust="spacingAndGlyphs">конкретных условиях;</text>
    <text transform="translate(724 571.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="193.1768" lengthAdjust="spacingAndGlyphs">– привязка объекта к участку;</text>
    <text transform="translate(724 588.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="558.8311" lengthAdjust="spacingAndGlyphs">– изменение заложенных в проекте материалов стен, перегородок, покрытий кровли;</text>
    <text transform="translate(724 605.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="630.458" lengthAdjust="spacingAndGlyphs">– разработка конструктивных решений под имеющиеся у Вас строительные элементы (сборные</text>
    <text transform="translate(724 622.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="246.9482" lengthAdjust="spacingAndGlyphs">плиты перекрытий, ФБС–блоки и т.д.)</text>
    <text transform="translate(724 639.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="600.3252" lengthAdjust="spacingAndGlyphs">– разработка фундаментов иного типа, если это позволяют геологические условия участка.</text>
    <text transform="translate(724 666) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="392.1709" lengthAdjust="spacingAndGlyphs">Стоимость таких услуг необходимо уточнять у менеджеров.</text>
    <text transform="translate(724 692.5) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="427.5879" lengthAdjust="spacingAndGlyphs">Более подробная информация имеется на сайте catalog-plans.ru.</text>
    <text transform="translate(724 719) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="561.333" lengthAdjust="spacingAndGlyphs">Желаем удачного строительства, а также будем Вам благодарны за фотографии уже</text>
    <text transform="translate(724 736) rotate(0) scale(0.85 1)" x="0" y="0" font-size="14" font-family="Arial, Liberation Sans, sans-serif" textLength="482.2822" lengthAdjust="spacingAndGlyphs">построенных объектов, которые можно выслать на адрес: info@plans1.ru.</text>
  </g>
<text x="40.254464285714285" y="933.2232142857142" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.205357142857142" data-print-folio="true">1 / 48</text></svg>