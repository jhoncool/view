  <g data-source-region="КД-1 · общие указания, правая колонка">
    <text transform="translate(723 68) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="489.7153" lengthAdjust="spacingAndGlyphs">1. Рабочая документация выполнена на основании чертежей марки АР, а также:</text>
    <text transform="translate(723 83) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="261.8853" lengthAdjust="spacingAndGlyphs">техническим заданием на проектирование;</text>
    <text transform="translate(723 98) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="613.8691" lengthAdjust="spacingAndGlyphs">национальными стандартами и сводами правил, в результате применения которых на обязательной</text>
    <text transform="translate(723 113) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="655.3257" lengthAdjust="spacingAndGlyphs">основе обеспечивается соблюдение требований Федерального закона №384-ФЗ ”Технический регламент о</text>
    <text transform="translate(723 128) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="511.1831" lengthAdjust="spacingAndGlyphs">безопасности зданий и сооружений”, иной нормативно-технической документацией:</text>
    <text transform="translate(723 143) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="490.5913" lengthAdjust="spacingAndGlyphs">–       №123-ФЗ ”Технический регламент о требованиях пожарной безопасности”;</text>
    <text transform="translate(723 158) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="604.3667" lengthAdjust="spacingAndGlyphs">–       ГОСТ 27751-2014 Надежность строительных конструкций и оснований. Основные положения;</text>
    <text transform="translate(723 173) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="326.6504" lengthAdjust="spacingAndGlyphs">–       ГОСТ 24454-80 Пиломатериалы хвойных пород;</text>
    <text transform="translate(723 188) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="293.1538" lengthAdjust="spacingAndGlyphs">–       СП 20.13330.2016 Нагрузки и воздействия;</text>
    <text transform="translate(723 203) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="436.4585" lengthAdjust="spacingAndGlyphs">–       СП 28.13330.2017 Защита строительных конструкций от коррозии;</text>
    <text transform="translate(723 218) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="329.4751" lengthAdjust="spacingAndGlyphs">–       СП 131.13330.2025 Строительная климатология;</text>
    <text transform="translate(723 233) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="298.1431" lengthAdjust="spacingAndGlyphs">–       СП 64.13330.2017 Деревянные конструкции</text>
    <text transform="translate(723 248) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="629.2114" lengthAdjust="spacingAndGlyphs">2. Для обеспечения заданных уклонов кровли все отметки и длины позиций, указанные на чертежах до</text>
    <text transform="translate(723 263) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="316.3545" lengthAdjust="spacingAndGlyphs">монтажа в проектное положение уточнить по месту.</text>
    <text transform="translate(723 278) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="546.311" lengthAdjust="spacingAndGlyphs">3. Материал конструкций – древесина хвойных пород I сорта с влажностью не более 30%</text>
    <text transform="translate(723 293) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="671.4741" lengthAdjust="spacingAndGlyphs">4. Опорные части деревянных конструкций, соприкасающиеся с кладкой, защитить от гниения, обернув двумя</text>
    <text transform="translate(723 308) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="245.9019" lengthAdjust="spacingAndGlyphs">слоями гидроизоляционного материала.</text>
    <text transform="translate(723 323) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="604.1572" lengthAdjust="spacingAndGlyphs">5. Выполнить огнезащитную обработку древесину и защиту ее от гниения путем глубокой пропитки</text>
    <text transform="translate(723 338) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="87.0771" lengthAdjust="spacingAndGlyphs">антисептиком.</text>
    <text transform="translate(723 353) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="667.3862" lengthAdjust="spacingAndGlyphs">6. Соединение несущих деревянных элементов кровли между собой выполняется при помощи оцинкованных</text>
    <text transform="translate(723 368) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="439.7021" lengthAdjust="spacingAndGlyphs">металлических соеденителей SIMPSON Strong-Tie или аналогичных им.</text>
    <text transform="translate(723 383) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="659.9849" lengthAdjust="spacingAndGlyphs">7. Окончательное решение о конструкции ”кровельного пирога” (расположение обрешетки, контробрешетки,</text>
    <text transform="translate(723 398) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="690.4917" lengthAdjust="spacingAndGlyphs">продухов для вентиляции подкровельного пространства и т.п.) принимает Подрядчик в соответствии с альбомом</text>
    <text transform="translate(723 413) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="365.0537" lengthAdjust="spacingAndGlyphs">технических решений применяемого кровельного покрытия.</text>
    <text transform="translate(723 428) rotate(0) scale(0.81 1)" x="0" y="0" font-size="13" font-family="Arial, Liberation Sans, sans-serif" textLength="236.1328" lengthAdjust="spacingAndGlyphs">8. Данный лист см. совместно с л.2...4.</text>
  </g>
